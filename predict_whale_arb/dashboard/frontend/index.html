<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Predict Whale Hunter</title><style>body{margin:0;background:#090b10;color:#eef1f7;font-family:Inter,Arial,sans-serif}header{padding:24px 32px;border-bottom:1px solid #20242d;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.pill{padding:8px 14px;border:1px solid #303641;border-radius:999px;background:#121620}.wrap{padding:28px;max-width:1300px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#10131a;border:1px solid #202631;border-radius:16px;padding:20px}.label{color:#8993a5;font-size:13px}.value{font-size:28px;font-weight:750;margin-top:8px}.section{margin-top:28px}.tabs{display:flex;gap:10px;margin-bottom:16px}.tab{padding:10px 15px;border-radius:10px;background:#151923;color:#cfd6e3}.active{background:#e9edf5;color:#0a0c10}.mode{display:flex;gap:8px}.mode button{border:1px solid #303641;background:#121620;color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid #202631}.empty{padding:32px;text-align:center;color:#8993a5}.green{color:#65d49b}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header{padding:18px}.wrap{padding:18px}}</style></head><body><header><div class="brand">🐋 Predict Whale Hunter</div><div class="mode"><button onclick="setMode('paper')">PAPER</button><button onclick="setMode('live')">LIVE</button></div></header><main class="wrap"><div class="grid"><div class="card"><div class="label">账户资金</div><div class="value" id="balance">$0</div></div><div class="card"><div class="label">今日盈亏</div><div class="value green" id="pnl">$0</div></div><div class="card"><div class="label">跟踪鲸鱼</div><div class="value" id="whales">0</div></div><div class="card"><div class="label">套利机会</div><div class="value" id="arb">0</div></div></div><div class="section"><div class="tabs"><div class="tab active">🐋 Whale Hunter</div><div class="tab">🎮 Esports</div><div class="tab">🏛️ Politics</div><div class="tab">💰 Arbitrage</div></div><div class="card"><h2>Top Whales</h2><table class="table"><thead><tr><th>Wallet</th><th>Category</th><th>Win Rate</th><th>ROI</th><th>Score</th></tr></thead><tbody id="whaleRows"></tbody></table><div id="emptyWhales" class="empty">等待 Predict.fun 数据连接…</div></div></div><div class="section"><div class="card"><h2>System</h2><p id="status">Connecting…</p><p class="label">默认安全模式：PAPER。Live trading 会保持锁定，直到执行凭证和风控检查完成。</p></div></div></main><script>async function refresh(){try{const d=await fetch('/api/dashboard').then(r=>r.json());document.getElementById('balance').textContent='$'+Number(d.account.balance).toLocaleString();document.getElementById('pnl').textContent='$'+Number(d.account.today_pnl).toLocaleString();document.getElementById('whales').textContent=d.whales.total;document.getElementById('arb').textContent=d.signals.arbitrage;document.getElementById('status').textContent='● '+d.mode.toUpperCase()+' — '+d.message}catch(e){document.getElementById('status').textContent='Dashboard API unavailable'}}async function setMode(mode){const r=await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})}).then(r=>r.json());alert(r.ok?'Mode: '+r.mode:r.error);refresh()}refresh();setInterval(refresh,5000)</script></body></html>
